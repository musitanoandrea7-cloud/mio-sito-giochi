name: Aggiornamento Giornaliero Giochi IGDB

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: Download del codice dal repository
      uses: actions/checkout@v4

    - name: Configurazione Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installazione delle librerie necessarie
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Esecuzione dello script Python app.py
      env:
        TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python app.py
